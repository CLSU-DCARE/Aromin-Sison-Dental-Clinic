<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Patient Chart | Aromin-Sison Dental Clinic</title>
<link rel="icon" type="image/png" href="../shared/images/favicon/asdc-wordmark-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../shared/css/variables.css?v=4">
<link rel="stylesheet" href="../shared/css/buttons.css?v=5">
<link rel="stylesheet" href="../shared/css/panels.css?v=4">
<link rel="stylesheet" href="assets/css/admin.css?v=20261020-patient-chart">
<link rel="stylesheet" href="assets/css/patient-chart.css?v=20261020-chart-ux2">
</head>
<body class="patient-chart-page">
<!-- "is-loading" shows grey placeholder shapes. The script removes it when data arrives. -->
<main class="chart-shell is-loading" id="chartShell">

  <!-- Top row: go back on the left, print on the right -->
  <div class="chart-topbar">
    <a class="btn btn-secondary btn-sm chart-back" href="dashboard.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Patient Management</a>
    <button type="button" class="btn btn-secondary btn-sm chart-print" id="printChart" hidden><i class="bi bi-printer" aria-hidden="true"></i> Print chart</button>
  </div>

  <header class="chart-heading">
    <p class="eyebrow"><span id="chartPortalRole">PORTAL</span> · PATIENT RECORDS</p>
    <h1>Patient Chart</h1>
    <p>Clinical and appointment history for clinic staff.</p>
  </header>

  <!-- Messages (errors) show here. Hidden while everything is fine. -->
  <div id="chartMessage" class="chart-message" role="alert" hidden>
    <i class="bi bi-exclamation-circle chart-message-icon" aria-hidden="true"></i>
    <div class="chart-message-body">
      <strong id="chartMessageTitle"></strong>
      <p id="chartMessageText"></p>
    </div>
    <div class="chart-message-actions" id="chartMessageActions"></div>
  </div>

  <!-- Patient card: name, status and contact details -->
  <section class="panel chart-profile" aria-labelledby="patientName">
    <div class="chart-profile-main">
      <div class="chart-avatar skeleton" id="patientInitials" aria-hidden="true"></div>
      <div class="chart-profile-text">
        <div class="chart-name-line">
          <h2 id="patientName"><span class="skeleton skeleton-line skeleton-name">Loading patient</span></h2>
          <span id="patientStatus"></span>
        </div>
        <p id="patientIdentifier" class="chart-muted"></p>
      </div>
    </div>
    <div class="chart-contact-grid" id="patientContact">
      <div><small>PHONE</small><span class="skeleton skeleton-line"></span></div>
      <div><small>EMAIL</small><span class="skeleton skeleton-line"></span></div>
      <div><small>REGISTERED</small><span class="skeleton skeleton-line"></span></div>
    </div>
  </section>

  <!-- Quick summary: the numbers staff look for first -->
  <div class="chart-stats" aria-label="Chart summary">
    <div class="chart-stat"><small>Clinical records</small><span id="recordCount">—</span></div>
    <div class="chart-stat"><small>Appointments</small><span id="appointmentCount">—</span></div>
    <div class="chart-stat"><small>Last visit</small><span id="lastVisit">—</span></div>
    <div class="chart-stat chart-stat-accent"><small>Next appointment</small><span id="nextAppointment">—</span></div>
  </div>

  <!-- Tabs: one section at a time, so the page stays short -->
  <div class="chart-tabs" role="tablist" aria-label="Chart sections" id="chartTabs">
    <button type="button" class="chart-tab is-active" role="tab" id="tabRecords" aria-controls="panelRecords" aria-selected="true">
      <i class="bi bi-clipboard2-pulse" aria-hidden="true"></i> Treatment records <span class="chart-tab-count" id="tabRecordsCount">0</span>
    </button>
    <button type="button" class="chart-tab" role="tab" id="tabAppointments" aria-controls="panelAppointments" aria-selected="false" tabindex="-1">
      <i class="bi bi-calendar-check" aria-hidden="true"></i> Appointments <span class="chart-tab-count" id="tabAppointmentsCount">0</span>
    </button>
  </div>

  <section class="panel chart-history chart-panel" id="panelRecords" role="tabpanel" aria-labelledby="tabRecords">
    <div class="chart-section-heading">
      <div><p class="eyebrow">CARE HISTORY</p><h2 id="recordsHeading">Clinical Treatment Records</h2></div>
      <div class="chart-tools">
        <label class="chart-search"><i class="bi bi-search" aria-hidden="true"></i><input id="recordsSearch" type="search" placeholder="Search diagnosis, treatment, dentist" aria-label="Search clinical records"></label>
        <label class="chart-sort"><span class="sr-only">Sort records</span>
          <select id="recordsSort" aria-label="Sort records">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
          </select>
        </label>
      </div>
    </div>
    <p class="chart-result-count" id="recordsCount" aria-live="polite"></p>
    <div id="recordsList" class="chart-entry-list">
      <div class="chart-skeleton-rows" aria-hidden="true"><span class="skeleton skeleton-row"></span><span class="skeleton skeleton-row"></span><span class="skeleton skeleton-row"></span></div>
    </div>
  </section>

  <section class="panel chart-history chart-panel" id="panelAppointments" role="tabpanel" aria-labelledby="tabAppointments" hidden>
    <div class="chart-section-heading">
      <div><p class="eyebrow">SCHEDULING HISTORY</p><h2 id="appointmentsHeading">Appointments</h2></div>
      <div class="chart-tools">
        <label class="chart-search"><i class="bi bi-search" aria-hidden="true"></i><input id="appointmentsSearch" type="search" placeholder="Search service, dentist, status" aria-label="Search appointment history"></label>
        <label class="chart-sort"><span class="sr-only">Sort appointments</span>
          <select id="appointmentsSort" aria-label="Sort appointments">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
          </select>
        </label>
      </div>
    </div>
    <!-- Filter chips: quickly narrow by appointment status -->
    <div class="chart-chips" id="appointmentFilters" role="group" aria-label="Filter appointments by status"></div>
    <p class="chart-result-count" id="appointmentsCount" aria-live="polite"></p>
    <div id="appointmentsList" class="chart-entry-list"></div>
  </section>
</main>
<div class="app-toast" id="appToast" role="status" aria-live="polite"></div>

<script src="../shared/js/core/namespace.js?v=20260930-production-api" defer></script>
<script src="../shared/js/core/api.js?v=20261002-receipt-url" defer></script>
<script src="../shared/js/core/routing.js?v=20261020-shared-staff-workspace" defer></script>
<script src="../shared/js/core/SessionGuard.js?v=20261020-shared-staff-workspace" defer></script>
<script src="../shared/js/core/HtmlHelpers.js?v=20260921-avatar-fallback" defer></script>
<script src="assets/js/patient-chart.js?v=20261020-chart-ux" defer></script>
</body>
</html>
