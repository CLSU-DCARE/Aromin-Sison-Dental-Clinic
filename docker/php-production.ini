display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; The largest application upload is 5 MiB. Leave protocol overhead headroom.
upload_max_filesize = 6M
post_max_size = 7M
max_file_uploads = 5

; Persist single-replica PHP sessions through Railway deployments. Apache
; denies direct access to the hidden directory in its virtual-host config.
session.save_path = "/var/www/html/backend/uploads/.sessions"
