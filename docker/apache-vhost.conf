<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The Railway Volume hides the repository's upload .htaccess files at
    # runtime. Keep private uploads protected at the server level instead.
    <LocationMatch "^/backend/uploads/(receipts|profiles)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/backend/uploads/\.">
        Require all denied
    </LocationMatch>

    <Directory /var/www/html/backend/uploads>
        Options -Indexes
        <FilesMatch "\.(php|phtml|php[0-9]*)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Vercel also emits this for the public proxy path. Keeping it at the
    # origin prevents unsafe caching when the Railway URL is reached directly.
    <LocationMatch "^/backend/">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </LocationMatch>
</VirtualHost>
